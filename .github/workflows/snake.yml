# ─────────────────────────────────────────────────────
# File location in your repo:
# .github/workflows/snake.yml
#
# HOW TO SET UP (one-time, 3 steps):
#
# Step 1 — Create a Personal Access Token
#   Go to GitHub → Settings → Developer Settings
#   → Personal Access Tokens → Tokens (classic)
#   → Generate new token (classic)
#   Scopes: check "repo" and "workflow"
#   Copy the token.
#
# Step 2 — Add it as a repo secret
#   Go to your profile repo: DivyanshuM-byte/DivyanshuM-byte
#   → Settings → Secrets and variables → Actions
#   → New repository secret
#   Name: GH_TOKEN
#   Value: (paste the token you just copied)
#   → Save
#
# Step 3 — Push this file to your repo at:
#   .github/workflows/snake.yml
#
# That's it. The snake runs automatically every 12 hours.
# To run it immediately: Actions tab → "Generate Snake" → Run workflow
# ─────────────────────────────────────────────────────

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # Runs every 12 hours
  workflow_dispatch:           # Also allows manual trigger from Actions tab
  push:
    branches:
      - main                   # Also regenerates on every push to main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DivyanshuM-byte
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
